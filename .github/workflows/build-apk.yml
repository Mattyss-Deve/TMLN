name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies, build web bundle, and sync Capacitor Android
        run: npm ci && npm run build && npx cap sync android

      - name: Build Android Debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Upload ChronoMap APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoMap-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
