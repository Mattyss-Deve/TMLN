<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f2334" />
      <stop offset="100%" stop-color="#070A0F" />
    </radialGradient>
    <linearGradient id="routeGrad" x1="112" y1="396" x2="380" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="coneGrad" x1="364" y1="156" x2="436" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="98" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Subtle cartographic rings -->
  <circle cx="256" cy="256" r="172" stroke="#22d3ee" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="8 10" />
  <circle cx="256" cy="256" r="112" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Ghost route tail -->
  <path
    d="M108 392 C164 388, 176 286, 246 276 C318 266, 294 186, 364 156"
    stroke="#94a3b8"
    stroke-opacity="0.28"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Glowing active polyline -->
  <path
    d="M108 392 C164 388, 176 286, 246 276 C318 266, 294 186, 364 156"
    stroke="url(#routeGrad)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Origin visit marker -->
  <circle cx="108" cy="392" r="16" fill="#070A0F" stroke="#34d399" stroke-width="6" />

  <!-- Heading cone + active location puck -->
  <path d="M364 156 L390 76 L444 130 Z" fill="url(#coneGrad)" />
  <circle cx="364" cy="156" r="36" fill="#22d3ee" fill-opacity="0.24" />
  <circle cx="364" cy="156" r="20" fill="#22d3ee" stroke="#ffffff" stroke-width="6" />
</svg>
